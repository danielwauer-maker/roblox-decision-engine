services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: roblox_decision_engine
      POSTGRES_USER: rde
      POSTGRES_PASSWORD: rde_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rde -d roblox_decision_engine"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - rde_pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ./apps/api
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://rde:rde_dev@postgres:5432/roblox_decision_engine
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/api/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      context: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    command: npm run dev -- -H 0.0.0.0

volumes:
  rde_pgdata:
